name: Remote frontend preview

on:
  push:
    branches: ['feature/remote-api-5.2.4']
    paths:
      - 'src/remote/**'
      - 'src/gui/mainwindow.ui'
      - 'src/icons/**'
      - '.github/workflows/remote-preview.yml'
  pull_request:
    paths:
      - 'src/remote/**'
      - 'src/gui/mainwindow.ui'
      - 'src/icons/**'
      - '.github/workflows/remote-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Configure
        run: cmake -S src/remote -B build-remote -DREMOTE_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-remote --config Release --parallel 2
      - name: Test
        working-directory: build-remote
        run: ctest -C Release --output-on-failure
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path remote-preview
          Copy-Item build-remote/Release/qbittorrent-remote.exe remote-preview/
          windeployqt --release --no-translations --no-opengl-sw remote-preview/qbittorrent-remote.exe
          Copy-Item COPYING.GPLv2 remote-preview/
          Copy-Item COPYING.GPLv3 remote-preview/
          Copy-Item doc/remote-client.md remote-preview/README.md
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: qbittorrent-remote-windows-x64-preview
          path: remote-preview/
