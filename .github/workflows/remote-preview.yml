name: Remote frontend preview

on:
  push:
    branches: [master, 'feature/remote-api-5.2.4']
    paths:
      - 'src/remote/**'
      - 'src/gui/**'
      - 'src/base/**'
      - 'src/lang/**'
      - 'src/icons/**'
      - 'doc/assets/remote-icon-proposal.svg'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: remote-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - name: Cancel obsolete builds on this work branch
        uses: actions/github-script@v8
        with:
          script: |
            const branch = 'feature/remote-api-5.2.4';
            if (context.ref !== 'refs/heads/' + branch) return;
            for (const status of ['queued', 'in_progress']) {
              const {data} = await github.rest.actions.listWorkflowRunsForRepo({
                ...context.repo, branch, status, per_page: 100
              });
              for (const run of data.workflow_runs) {
                if (run.id >= context.runId) continue;
                if (run.name !== 'Remote frontend preview' && !run.name.startsWith('CI - ')) continue;
                try {
                  await github.rest.actions.cancelWorkflowRun({...context.repo, run_id: run.id});
                  core.info('Cancelled obsolete run ' + run.id + ': ' + run.name);
                } catch (error) {
                  core.warning('Could not cancel run ' + run.id + ': HTTP ' + error.status);
                }
              }
            }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          archives: qtbase qtsvg qttools
          cache: true
      - name: Configure
        run: cmake -S src/remote -B build-remote -A x64 -DREMOTE_TESTING=ON
      - name: Build
        run: cmake --build build-remote --config Release --parallel 2
      - name: Test
        working-directory: build-remote
        run: ctest -C Release --output-on-failure
      - name: Package Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path remote-preview
          Copy-Item build-remote/Release/qbittorrent-remote.exe remote-preview/
          windeployqt --release --no-translations --no-opengl-sw remote-preview/qbittorrent-remote.exe
          Copy-Item AUTHORS,COPYING,COPYING.GPLv2 remote-preview/
          Copy-Item COPYING.GPLv3 remote-preview/
          Copy-Item doc/remote-third-party.txt remote-preview/
          Copy-Item doc/remote-client.md remote-preview/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: qbittorrent-remote-windows-x64-preview
          path: remote-preview/

  release:
    name: Publish Windows release
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: qbittorrent-remote-windows-x64-preview
          path: portable
      - name: Publish versioned archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(cat src/remote/VERSION.txt)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $version already exists."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null; then
            echo "::error::Tag $version already exists. Choose an unused version."
            exit 1
          else
            status=$?
            test "$status" -eq 2
          fi
          archive="qbittorrent-remote-$version-windows-x64.zip"
          (cd portable && zip -qr "../$archive" .)
          cat > release-notes.md <<'NOTES'
          Native desktop client for an unmodified qBittorrent or qbittorrent-nox server with Web UI enabled.

          - Portable Windows x64 build with Qt libraries.
          - Supports qBittorrent 5.2.x and 5.3.x with Web API 2.x from 2.15.1.
          - Manage transfers, add torrents, search using server plugins, and view the server log.
          - Includes server path suggestions, recent paths, and tracker merge prompts for recognized duplicates.

          The interface is based on [qBittorrent 5.2.4](https://github.com/qbittorrent/qBittorrent).
          NOTES
          gh release create "$version" "$archive" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "qBittorrent Remote $version" --notes-file release-notes.md
